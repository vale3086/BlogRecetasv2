{% extends 'pages/base.html' %}

{% block title %}Eliminar receta | RecetasBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="bi bi-trash me-2"></i>Eliminar receta</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger fs-1 d-block mb-3"></i>
                    <h5>¿Estás segura de que querés eliminar esta receta?</h5>
                    <p class="text-muted"><strong>{{ receta.titulo }}</strong></p>
                    <p class="text-danger small">Esta acción no se puede deshacer.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash me-1"></i>Sí, eliminar
                            </button>
                            <a href="{% url 'receta_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
