{% extends 'pages/base.html' %}

{% block title %}Iniciar sesión | RecetasBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="Tu nombre de usuario" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                        </button>
                    </form>
                    <hr>
                    <p class="text-center text-muted small mb-0">
                        ¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate acá</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
